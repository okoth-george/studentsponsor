# ============================================================
#  STUDENT SPONSOR SYSTEM — DOCKER COMPOSE
#  Runs: PostgreSQL + Node.js API
#  Usage:
#    Start:        docker compose up -d
#    Stop:         docker compose down
#    Fresh start:  docker compose down -v && docker compose up -d
#    Logs:         docker compose logs -f
#    API logs:     docker compose logs -f api
#    DB logs:      docker compose logs -f postgres
# ============================================================

services:

  # ── POSTGRESQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: student_sponsor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_sponsor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_sponsor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── NODE.JS API ────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: student_sponsor_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      FRONTEND_URL: http://localhost:5173

      # Database — use service name 'postgres', NOT localhost
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: student_sponsor
      DB_USER: postgres
      DB_PASSWORD: postgres

      # JWT
      JWT_SECRET: 9f3c7b5a2d8e4a6f1c0b9e7d3a2f6c8e5b1a4d7c9e0f2a6b3c8d1e5f7a9b0c6d
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: 7b1e9c4a6d2f8e3a0c5b7d1f9e6a2c4d8f0b3a7e1c6d9f2a5b8c0e4d7f1a3c6b
      REFRESH_TOKEN_EXPIRES_IN: 7d

      # Email (Mailtrap for dev)
      SMTP_HOST: sandbox.smtp.mailtrap.io
      SMTP_PORT: 2525
      SMTP_USER: e2926b596eaa3c
      SMTP_PASS: c2bae0cfdf2e7a
      EMAIL_FROM: noreply@studentsponsor.ke

      # App URLs
      APP_URL: http://localhost:5000
      CLIENT_URL: http://localhost:5173

      # Account lockout
      MAX_LOGIN_ATTEMPTS: 5
      LOCK_TIME_MINUTES: 15

      # M-Pesa
      MPESA_CONSUMER_KEY: your_consumer_key
      MPESA_CONSUMER_SECRET: your_consumer_secret
      MPESA_SHORTCODE: 174379
      MPESA_PASSKEY: your_passkey
      MPESA_CALLBACK_URL: http://localhost:5000/api/payments/callback
      MPESA_ENV: sandbox

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: your_cloud_name
      CLOUDINARY_API_KEY: your_api_key
      CLOUDINARY_API_SECRET: your_api_secret

    volumes:
      # Mount entire server folder into /app
      - ./server:/app
      # Keep node_modules from the image — don't overwrite with host's
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && node src/index.js"

volumes:
  pgdata:
    name: student_sponsor_pgdata